# Withdrawal Form: a Shopify app without a server of its own, installed on one store by custom
# distribution. It asks for no access to store data. It adds theme blocks (the
# "Vertrag widerrufen" button and form); the form posts to ERPNext. Its page in the
# Shopify admin (application_url) is served by ERPNext too and lists the declarations:
# ecommerce_integrations/shopify/withdrawal_app.py.
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "f31e2cb3a14ad23d5b776ae47199009c"
name = "Withdrawal Form"
application_url = "https://erp.scarnatti.com/api/method/ecommerce_integrations.shopify.withdrawal_app.page"
embedded = true

[build]

[webhooks]
api_version = "2025-10"

[access_scopes]
scopes = ""

[auth]
redirect_urls = ["https://shopify.dev/apps/default-app-home/api/auth"]

[pos]
embedded = false
